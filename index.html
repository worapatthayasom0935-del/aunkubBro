<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>มังคุดซีเล็ค — ระบบวินิจฉัยโรคมังคุดเรียลไทม์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120C16;
    --bg2: #180F1D;
    --surface: rgba(255,255,255,0.045);
    --surface-strong: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --text: #F2ECF4;
    --text-dim: rgba(242,236,244,0.6);
    --orchid: #B7488F;
    --orchid-glow: #E27FC0;
    --leaf: #6FBF73;
    --gold: #E8B54D;
    --rose: #E0596B;
    --amber: #E0A23D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  .bg-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.28; z-index: 0; pointer-events: none; }
  .bg-blob.b1 { width: 380px; height: 380px; background: var(--orchid); top: -140px; right: -120px; }
  .bg-blob.b2 { width: 340px; height: 340px; background: var(--leaf); bottom: 10%; left: -140px; opacity: 0.16; }
  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.05;
    background-image: radial-gradient(rgba(255,255,255,0.6) 0.6px, transparent 0.6px);
    background-size: 4px 4px;
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; position: relative; z-index: 1; }

  header.app-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .brand-group { display: flex; align-items: center; gap: 11px; }
  .mark { width: 40px; height: 40px; flex: none; }
  .mark svg { width: 100%; height: 100%; }
  .brand-text h1 {
    font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 18px; margin: 0;
    color: var(--text); letter-spacing: 0.2px;
  }
  .brand-text p { margin: 2px 0 0; font-size: 11px; color: var(--text-dim); letter-spacing: 0.3px; }

  .nav-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); padding: 3px; border-radius: 100px; }
  .tab-btn {
    font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 600; border: none;
    background: transparent; color: var(--text-dim); padding: 6px 13px; border-radius: 100px; cursor: pointer;
  }
  .tab-btn.active { background: var(--orchid); color: #fff; }

  .hero-line { font-size: 13.5px; line-height: 1.7; color: var(--text-dim); margin: 0 0 16px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card {
    background: var(--surface); border-radius: 22px; border: 1px solid var(--border);
    backdrop-filter: blur(18px); overflow: hidden;
    box-shadow: 0 20px 50px -30px rgba(0,0,0,0.7);
    transition: border-color 0.3s;
  }
  .card.dragover { border-color: var(--orchid-glow); background: rgba(183, 72, 143, 0.1); }

  /* ===== Stage ===== */
  .stage {
    position: relative; aspect-ratio: 3/4; max-height: 440px;
    background: linear-gradient(160deg, #0d0710, #1c1120);
    overflow: hidden;
  }
  video, img.preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  img.preview-img { display: none; }
  canvas.hidden-canvas { display: none; }

  .stage-empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 20px; z-index: 2;
  }
  .stage-empty .ring-icon { width: 64px; height: 64px; opacity: 0.9; }
  .stage-empty p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); max-width: 260px; }

  .btn-group-action { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-start, .btn-upload {
    font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 12.5px;
    border: none; padding: 10px 18px; border-radius: 100px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px;
  }
  .btn-start { background: linear-gradient(135deg, var(--orchid), var(--orchid-glow)); color: #fff; }
  .btn-upload { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.18); }

  /* reticle */
  .reticle { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 3; pointer-events: none; }
  .reticle svg { width: 62%; opacity: 0.55; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.65; transform: scale(1.03); } }
  .stage.active .reticle { display: flex; }

  .scan-sweep {
    position: absolute; left: 8%; right: 8%; top: 6%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    box-shadow: 0 0 12px 2px rgba(232,181,77,0.7); animation: sweep 1.8s ease-in-out infinite;
    opacity: 0; z-index: 4;
  }
  .stage.scanning .scan-sweep { opacity: 1; }
  @keyframes sweep { 0% { top: 6%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 92%; opacity: 0; } }

  .stage-topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 12px; z-index: 5; gap: 8px; }
  .pill {
    font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 6px 11px; border-radius: 100px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--leaf); }
  .dot.live { background: var(--rose); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .live-toggle {
    font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 12px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .live-toggle.on { background: linear-gradient(135deg, var(--orchid), var(--orchid-glow)); border-color: transparent; }

  .icon-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.4); border: none; display: grid; place-items: center; cursor: pointer; color: #fff; flex: none; }
  .icon-btn svg { width: 15px; height: 15px; }

  .stage-bottombar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 12px; z-index: 5; background: linear-gradient(to top, rgba(0,0,0,0.45), transparent); }
  .shutter { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 3px solid rgba(255,255,255,0.3); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .shutter-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--orchid); display: grid; place-items: center; }
  .shutter-inner svg { width: 20px; height: 20px; color: #fff; }

  /* ===== Category chips ===== */
  .chip-bar { padding: 14px 16px 4px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    font-family: 'Chakra Petch', sans-serif; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    background: var(--surface-strong); border: 1px solid var(--border); color: var(--text);
    padding: 7px 13px; border-radius: 100px; cursor: pointer; flex: none; display: flex; align-items: center; gap: 6px;
  }
  .chip .chip-dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip:hover { border-color: var(--orchid-glow); }

  /* ===== Result panel ===== */
  .panel { padding: 18px 16px 20px; }
  .panel-idle { text-align: center; padding: 22px 10px; color: var(--text-dim); font-size: 12.5px; line-height: 1.8; }

  .result-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .ring-wrap { position: relative; width: 62px; height: 62px; flex: none; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-wrap .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 700;
  }
  .eyebrow { font-family: 'Chakra Petch', sans-serif; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 0 0 4px; }
  .disease-name { font-family: 'Chakra Petch', sans-serif; font-size: 19px; font-weight: 600; margin: 0; color: var(--text); line-height: 1.3; }

  .severity-tag {
    font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 100px; display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
  }
  .tag-mild { background: rgba(111,191,115,0.15); color: var(--leaf); }
  .tag-mid { background: rgba(224,162,61,0.15); color: var(--amber); }
  .tag-severe { background: rgba(224,89,107,0.15); color: var(--rose); }

  .section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .section-title { font-family: 'Chakra Petch', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 7px; margin: 0 0 8px; }
  .section p { margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--text-dim); }

  .timeline { margin: 0; padding: 0; list-style: none; position: relative; }
  .timeline li { display: flex; gap: 12px; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); padding-bottom: 16px; position: relative; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ''; position: absolute; left: 10px; top: 22px; bottom: 0; width: 1px; background: var(--border);
  }
  .timeline li:last-child::before { display: none; }
  .step-num {
    font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 11px; color: #fff;
    background: linear-gradient(135deg, var(--orchid), var(--orchid-glow));
    width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; flex: none; z-index: 1;
  }

  .btn-secondary {
    font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 12.5px;
    border-radius: 100px; padding: 12px 16px; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface-strong); color: var(--text); width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px;
  }
  .btn-secondary:hover { border-color: var(--orchid-glow); }

  .error-box { padding: 14px; border: 1px solid rgba(224,89,107,0.4); background: rgba(224,89,107,0.08); border-radius: 14px; font-size: 13px; color: var(--rose); line-height: 1.6; }

  /* ===== Guide tab ===== */
  .guide-card { background: var(--surface); border-radius: 22px; border: 1px solid var(--border); padding: 22px 18px; backdrop-filter: blur(18px); }
  .guide-title { font-family: 'Chakra Petch', sans-serif; font-size: 17px; color: var(--text); margin: 0 0 18px; display: flex; align-items: center; gap: 9px; }
  .guide-step { display: flex; gap: 14px; margin-bottom: 18px; }
  .guide-step-icon {
    width: 32px; height: 32px; border-radius: 10px; background: var(--surface-strong); border: 1px solid var(--border);
    color: var(--orchid-glow); display: grid; place-items: center; flex: none;
    font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px;
  }
  .guide-step-text h4 { margin: 0 0 3px; font-family: 'Chakra Petch', sans-serif; font-size: 14px; color: var(--text); }
  .guide-step-text p { margin: 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }

  .kb-list { margin-top: 16px; display: grid; gap: 8px; }
  .kb-item { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 10px 12px; background: var(--surface-strong); border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); }
  .kb-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .loading-row { display: flex; align-items: center; gap: 10px; padding: 22px 4px; justify-content: center; color: var(--text); font-family: 'Chakra Petch', sans-serif; font-size: 12.5px; }
  .spinner { width: 17px; height: 17px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.12); border-top-color: var(--orchid-glow); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer.note { text-align: center; font-size: 10.5px; color: var(--text-dim); opacity: 0.6; margin-top: 20px; line-height: 1.7; padding: 0 20px; }
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="grain"></div>

<div class="wrap">

  <header class="app-head">
    <div class="brand-group">
      <div class="mark">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="19" fill="none" stroke="#B7488F" stroke-width="1"/>
          <path d="M20 6 L23 16 L33 13 L26 21 L33 27 L23 24 L20 34 L17 24 L7 27 L14 21 L7 13 L17 16 Z" fill="#E8B54D" opacity="0.9"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>มังคุดซีเล็ค</h1>
        <p>วินิจฉัยโรคมังคุดแบบเรียลไทม์ด้วย AI</p>
      </div>
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('scanTab', this)">สแกน</button>
      <button class="tab-btn" onclick="switchTab('guideTab', this)">วิธีใช้</button>
    </nav>
  </header>

  <div id="scanTab" class="tab-content active">
    <p class="hero-line">เปิดกล้อง อัปโหลดรูปภาพ หรือลากไฟล์ภาพมาวางที่นี่ เพื่อวินิจฉัยอาการผิดปกติของมังคุดทันที</p>

    <div class="card" id="dropCard">
      <div class="stage" id="stage">
        <video id="video" autoplay playsinline muted></video>
        <img id="previewImg" class="preview-img" alt="ภาพตัวอย่างสแกน">
        <canvas class="hidden-canvas" id="canvas"></canvas>

        <div class="stage-empty" id="stageEmpty">
          <svg class="ring-icon" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="#E27FC0" stroke-width="1" opacity="0.5"/>
            <path d="M20 6 L23 16 L33 13 L26 21 L33 27 L23 24 L20 34 L17 24 L7 27 L14 21 L7 13 L17 16 Z" fill="#E8B54D" opacity="0.85"/>
          </svg>
          <p>เปิดกล้อง อัปโหลด หรือลากไฟล์ภาพมาวางที่นี่ (เปลือก ผล ใบ กิ่ง โคนต้น)</p>
          <div class="btn-group-action">
            <button class="btn-start" id="startBtn">เปิดกล้อง</button>
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              อัปโหลดภาพ
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
          </div>
        </div>

        <div class="reticle" id="reticle">
          <svg viewBox="0 0 100 100" fill="none">
            <path d="M50 14 L57 40 L83 32 L64 52 L83 68 L57 60 L50 86 L43 60 L17 68 L36 52 L17 32 L43 40 Z" stroke="#E8B54D" stroke-width="1.4"/>
          </svg>
        </div>
        <div class="scan-sweep" id="sweep"></div>

        <div class="stage-topbar" id="topbar" style="display:none;">
          <div class="pill"><span class="dot" id="statusDot"></span><span id="pillText">พร้อมสแกน</span></div>
          <div style="display:flex; gap:8px;">
            <button class="live-toggle" id="liveToggle" title="โหมดสแกนสด">
              <span id="liveIcon">●</span><span id="liveLabel">โหมดสด</span>
            </button>
            <button class="icon-btn" id="switchBtn" title="สลับกล้อง">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>
        </div>

        <div class="stage-bottombar" id="bottombar" style="display:none;">
          <button class="shutter" id="shutterBtn" title="ถ่ายภาพ">
            <span class="shutter-inner">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="3.2"/><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/></svg>
            </span>
          </button>
        </div>
      </div>

      <div class="chip-bar">
        <button class="chip" onclick="simulateDemo('gummosis')"><span class="chip-dot" style="background:var(--amber)"></span>เนื้อแก้วยางไหล</button>
        <button class="chip" onclick="simulateDemo('thrips')"><span class="chip-dot" style="background:var(--leaf)"></span>เพลี้ยไฟ</button>
        <button class="chip" onclick="simulateDemo('leafminer')"><span class="chip-dot" style="background:#7FB6E0"></span>หนอนชอนใบ</button>
        <button class="chip" onclick="simulateDemo('rootrot')"><span class="chip-dot" style="background:#B5895A"></span>รากเน่าโคนเน่า</button>
        <button class="chip" onclick="simulateDemo('leafspot')"><span class="chip-dot" style="background:var(--rose)"></span>ใบจุด/ผลเน่า</button>
        <button class="chip" onclick="simulateDemo('pink')"><span class="chip-dot" style="background:var(--orchid-glow)"></span>ราสีชมพู</button>
      </div>

      <div class="panel" id="panel">
        <div class="panel-idle">— ผลการวิเคราะห์จะปรากฏที่นี่ —</div>
      </div>
    </div>
  </div>

  <div id="guideTab" class="tab-content">
    <div class="guide-card">
      <h3 class="guide-title">
